name: Build LEDE PVE X86_64 PassWall

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@main


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          wget


    - name: Clone LEDE
      run: |
        git clone https://github.com/coolsnowwolf/lede.git openwrt


    - name: Add PassWall feeds
      run: |
        cd openwrt

        sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default

        sed -i '2i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default


    - name: Update feeds
      run: |
        cd openwrt

        ./scripts/feeds update -a

        ./scripts/feeds install -a


    - name: Configure X86 PVE
      run: |
        cd openwrt

        make defconfig

        ./scripts/config set CONFIG_TARGET_x86=y
        ./scripts/config set CONFIG_TARGET_x86_64=y
        ./scripts/config set CONFIG_TARGET_x86_64_DEVICE_generic=y

        make defconfig


        # VirtIO for PVE

        ./scripts/config set CONFIG_PACKAGE_kmod-virtio=y
        ./scripts/config set CONFIG_PACKAGE_kmod-virtio-net=y
        ./scripts/config set CONFIG_PACKAGE_kmod-virtio-pci=y
        ./scripts/config set CONFIG_PACKAGE_kmod-virtio-scsi=y


        # LuCI

        ./scripts/config set CONFIG_PACKAGE_luci=y
        ./scripts/config set CONFIG_PACKAGE_luci-compat=y


        # PassWall

        ./scripts/config set CONFIG_PACKAGE_luci-app-passwall=y


        # DNS

        ./scripts/config set CONFIG_PACKAGE_dnsmasq-full=y
        ./scripts/config set CONFIG_PACKAGE_smartdns=y
        ./scripts/config set CONFIG_PACKAGE_luci-app-smartdns=y


        # AdGuardHome

        ./scripts/config set CONFIG_PACKAGE_adguardhome=y
        ./scripts/config set CONFIG_PACKAGE_luci-app-adguardhome=y


        # Firewall proxy

        ./scripts/config set CONFIG_PACKAGE_ipset=y
        ./scripts/config set CONFIG_PACKAGE_kmod-tun=y
        ./scripts/config set CONFIG_PACKAGE_iptables-mod-tproxy=y


        # Docker

        ./scripts/config set CONFIG_PACKAGE_dockerd=y
        ./scripts/config set CONFIG_PACKAGE_docker-compose=y
        ./scripts/config set CONFIG_PACKAGE_luci-app-dockerman=y


        # Storage

        ./scripts/config set CONFIG_PACKAGE_block-mount=y
        ./scripts/config set CONFIG_PACKAGE_kmod-fs-ext4=y


        # Tools

        ./scripts/config set CONFIG_PACKAGE_htop=y
        ./scripts/config set CONFIG_PACKAGE_curl=y
        ./scripts/config set CONFIG_PACKAGE_wget=y
        ./scripts/config set CONFIG_PACKAGE_tcpdump=y
        ./scripts/config set CONFIG_PACKAGE_iperf3=y
        ./scripts/config set CONFIG_PACKAGE_nano=y


        # SSL

        ./scripts/config set CONFIG_PACKAGE_ca-bundle=y
        ./scripts/config set CONFIG_PACKAGE_ca-certificates=y


        make defconfig


    - name: Download packages
      run: |
        cd openwrt

        make download -j8


    - name: Compile firmware
      run: |
        cd openwrt

        make -j$(nproc) V=s


    - name: Upload firmware
      uses: actions/upload-artifact@main
      with:
        name: LEDE-PVE-X86-PassWall
        path: openwrt/bin/targets/x86/64/*
