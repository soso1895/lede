name: Build LEDE PVE X86_64 PassWall

on:
  workflow_dispatch:


env:
  TZ: Asia/Shanghai


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout
      uses: actions/checkout@main


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
        build-essential clang flex bison g++ gawk \
        gcc-multilib gettext git \
        libncurses-dev libssl-dev \
        python3 python3-setuptools \
        rsync unzip zlib1g-dev wget


    - name: Clone LEDE
      run: |
        git clone https://github.com/coolsnowwolf/lede.git openwrt



    - name: Add PassWall feeds
      run: |

        cd openwrt

        sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default

        sed -i '2i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default



    - name: Remove conflicting packages
      run: |

        cd openwrt


        rm -rf feeds/packages/net/xray-core

        rm -rf feeds/packages/net/sing-box

        rm -rf feeds/packages/net/hysteria

        rm -rf feeds/packages/net/v2ray-geodata

        rm -rf feeds/packages/net/geoview

        rm -rf feeds/packages/net/microsocks

        rm -rf feeds/packages/net/tcping

        rm -rf feeds/packages/net/shadowsocks-rust

        rm -rf feeds/packages/net/shadowsocksr-libev

        rm -rf feeds/packages/net/v2ray-plugin

        rm -rf feeds/packages/net/xray-plugin



    - name: Update feeds

      run: |

        cd openwrt

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Configure

      run: |

        cd openwrt


        make x86/64_defconfig


        cat >> .config <<EOF


# Target

CONFIG_TARGET_x86=y

CONFIG_TARGET_x86_64=y

CONFIG_TARGET_x86_64_DEVICE_generic=y



# Images

CONFIG_TARGET_IMAGES_GZIP=y



# PVE VirtIO

CONFIG_PACKAGE_kmod-virtio=y

CONFIG_PACKAGE_kmod-virtio-net=y

CONFIG_PACKAGE_kmod-virtio-pci=y

CONFIG_PACKAGE_kmod-virtio-scsi=y



# LuCI

CONFIG_PACKAGE_luci=y

CONFIG_PACKAGE_luci-compat=y



# PassWall

CONFIG_PACKAGE_luci-app-passwall=y



# DNS

CONFIG_PACKAGE_dnsmasq-full=y

CONFIG_PACKAGE_smartdns=y

CONFIG_PACKAGE_luci-app-smartdns=y



# AdGuardHome

CONFIG_PACKAGE_adguardhome=y

CONFIG_PACKAGE_luci-app-adguardhome=y



# Firewall

CONFIG_PACKAGE_ipset=y

CONFIG_PACKAGE_kmod-tun=y

CONFIG_PACKAGE_iptables-mod-tproxy=y



# Docker

CONFIG_PACKAGE_dockerd=y

CONFIG_PACKAGE_docker-compose=y

CONFIG_PACKAGE_luci-app-dockerman=y



# Storage

CONFIG_PACKAGE_block-mount=y

CONFIG_PACKAGE_kmod-fs-ext4=y



# Tools

CONFIG_PACKAGE_htop=y

CONFIG_PACKAGE_curl=y

CONFIG_PACKAGE_wget=y

CONFIG_PACKAGE_tcpdump=y

CONFIG_PACKAGE_iperf3=y

CONFIG_PACKAGE_nano=y



# SSL

CONFIG_PACKAGE_ca-bundle=y

CONFIG_PACKAGE_ca-certificates=y


EOF



        make defconfig



    - name: Download

      run: |

        cd openwrt

        make download -j8



    - name: Compile

      run: |

        cd openwrt

        make -j$(nproc) V=s



    - name: Upload

      uses: actions/upload-artifact@main

      with:

        name: LEDE-PVE-X86-PassWall-final

        path: openwrt/bin/targets/x86/64/*
